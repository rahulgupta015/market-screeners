name: daily-screener

on:
  schedule:
    - cron: "30 22 * * 0-4"   # Runs at 5:30 PM EST (22:30 UTC), Sun–Thu
  workflow_dispatch: {}

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Sync dependencies
        run: uv sync

      - name: Run screener and export HTML report
        run: |
          DAY=$(date +%a | tr '[:lower:]' '[:upper:]')
          uv run python -m market_screeners \
            --export-html data/screener_${DAY}.html

      - name: Commit snapshot to repository
        run: |
          DAY=$(date +%a | tr '[:lower:]' '[:upper:]')
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/screener_${DAY}.html
          git diff --cached --quiet || git commit -m "chore: update screener ${DAY} [skip ci]"
          git push
