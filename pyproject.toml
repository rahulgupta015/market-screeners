[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dsm"
version = "0.1.0"
description = "Daily Stock Monitor - Advanced stock breakout scanner using technical analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.5",
    "pandas-ta-classic==0.6.52",
    "yfinance>=1.5.2",
]

[project.scripts]
dsm = "dsm.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dsm"]
