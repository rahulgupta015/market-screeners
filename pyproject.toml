[project]
name = "dsm"
version = "0.1.0"
description = "Daily Stock Monitor - Advanced stock breakout scanner using technical analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "yfinance>=1.5.2",
]

[project.scripts]
dsm = "dsm.main:main"
