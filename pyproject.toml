[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "market-screeners"
version = "0.1.0"
description = "Market screeners for stocks and ETFs using technical analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.5",
    "pandas-ta-classic==0.6.52",
    "rich>=13.7",
    "yfinance>=1.5.2",
]

[project.scripts]
market-screeners = "market_screeners.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/market_screeners"]
